name: CI

on:
  push:
    branches: [main, 'modernization/**']
  pull_request:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Syntax check
        run: |
          node --check server.js
          node --check config/db.js
          node --check routes/api/auth.js
      - name: Start API
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/devconnector_ci
          JWT_SECRET: ci-test-secret
          PORT: 5000
        run: |
          node server.js > /tmp/devconnector.log 2>&1 &
          echo $! > /tmp/devconnector.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health/ready; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/health/live
          curl -fsS http://127.0.0.1:5000/
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/devconnector.pid ]; then kill "$(cat /tmp/devconnector.pid)" || true; fi
          cat /tmp/devconnector.log || true
